# ----------------------------------------------------------------------------
# Publish image in Docker Hub Workflow
# This workflow builds and pushes a Docker image to Docker Hub whenever
# a new release is published on GitHub.
# ----------------------------------------------------------------------------

name: Publish image in Docker Hub

on:
  release:
    # Trigger only when a release is published
    types: [published]

jobs:
  push_to_registry:
    runs-on: ubuntu-24.04

    steps:
      
      # Step 1: Check out the repository code
      - uses: actions/checkout@v5

            # Step de diagnóstico: verifica presencia y longitud de los secretos
      - name: Debug secrets presence
        env:
          D_USER: ${{ secrets.DOCKER_USER }}
          D_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "Longitud DOCKER_USER: ${#D_USER}"
          echo "Longitud DOCKER_PASSWORD: ${#D_PASS}"
          if [ -z "$D_USER" ]; then echo "::error::DOCKER_USER está VACÍO en GitHub Actions"; fi
          if [ -z "$D_PASS" ]; then echo "::error::DOCKER_PASSWORD está VACÍO en GitHub Actions"; fi
          if [[ "$D_USER" == *"@"* ]]; then echo "::error::DOCKER_USER es un email, debe ser tu Docker ID (username)"; fi
          
      # Step 2: Log in to Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build and push the Docker image
      - name: Build and push Docker image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          TAG=${{ github.event.release.tag_name }}
          IMAGE=${{ secrets.DOCKER_USER }}/pokehub

          docker build --build-arg VERSION_TAG=$TAG -t $IMAGE:$TAG -f docker/images/Dockerfile.prod .
          docker push $IMAGE:$TAG

          docker tag $IMAGE:$TAG $IMAGE:latest
          docker push $IMAGE:latest
