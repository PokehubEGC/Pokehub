# ----------------------------------------------------------------------------
# DevSecOps Pipeline: Container Vulnerability Scanning
# This workflow builds the production Docker image and performs a comprehensive
# security scan with Aqua Security Trivy for both OS and application dependencies.
# Scan results are exported in SARIF format and uploaded to the GitHub Security tab.
# ----------------------------------------------------------------------------

name: DevSecOps Container Security

on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'pyproject.toml'
      - 'package.json'
      - 'app/**'
      - '.github/workflows/CD_devsecops.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'pyproject.toml'
      - 'package.json'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security_scan:
    name: Build & Scan Docker Image
    runs-on: ubuntu-24.04

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build Docker image locally (load into daemon for scanning)
      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/images/Dockerfile.prod
          push: false
          load: true
          tags: pokehub:security-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 4: Run Trivy scan (SARIF format for GitHub Security tab)
      - name: Run Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'pokehub:security-scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          vuln-type: 'os,library'
        continue-on-error: true

      # Step 5: Run Trivy scan (Table format for step logs)
      - name: Run Trivy vulnerability scan (Table Summary)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'pokehub:security-scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          vuln-type: 'os,library'

      # Step 6: Upload findings to GitHub Code Scanning (Security Tab)
      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
